# ai-pixel-analysis 服务配置
# host 与 port 在这里统一管理；各接口的 endpoint（路径）也全部配置化，代码不内嵌路径。

[server]
host = "https://ai-pixel.online"
port = 443
timeout_ms = 30000

# 各接口 endpoint（相对 host 的路径）。{id} 为占位符，调用时替换。
[endpoints]
login_page = "/login"
login = "/api/v1/auth/login"
accounts = "/api/v1/accounts"
usage = "/api/v1/accounts/{id}/usage"
stats = "/api/v1/accounts/{id}/stats"
ledger = "/api/v1/usage/balance-ledger"
